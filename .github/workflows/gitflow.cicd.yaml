name: GitFlow Lab (dummy)

# Workflow dummy para probar el flujo de gitflow.png:
#   feature/*  -> unit tests + sonar
#   develop    -> tests + sonar + build + tag vX.Y.Z-prerelease.N + deploy dev
#   release/*  -> build + tag vX.Y.Z-rc.N + publish artifacts + deploy pre
#   hotfix/*   -> build + tag vX.Y.(Z+1)-rc.N + deploy pre
#   main       -> retag imagen vX.Y.Z (sin rebuild) + tag + deploy pro (gated) + sync main -> develop
# La version se calcula en .github/scripts/semver.sh a partir de version.json y los tags.

on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - develop
      - main
      - 'release/**'
  workflow_dispatch:
    inputs:
      fail_pro_deploy:
        description: 'Simular fallo en Deploy PRO (el sync a develop NO debe ejecutarse)'
        type: boolean
        default: false

permissions:
  contents: write        # tags, releases, push a develop
  pull-requests: write   # PR de sync si hay conflicto
  actions: write         # re-disparar develop tras el sync

# Una ejecucion a la vez por rama; nunca cancelar (evita tags duplicados / deploys a medias)
concurrency:
  group: gitflow-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ───────────────────────── Versionado automatico ─────────────────────────
  setup:
    name: Calcular version
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.semver.outputs.kind }}
      version: ${{ steps.semver.outputs.version }}
      tag: ${{ steps.semver.outputs.tag }}
      rc_tag: ${{ steps.semver.outputs.rc_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --tags --force
      - id: semver
        env:
          # En PR no se versiona: solo checks
          BRANCH: ${{ github.event_name == 'pull_request' && 'pr-check' || github.ref_name }}
        run: .github/scripts/semver.sh "$BRANCH" version.json
      - name: Resumen
        run: |
          {
            echo "### Version"
            echo "| kind | version | tag |"
            echo "|---|---|---|"
            echo "| ${{ steps.semver.outputs.kind }} | ${{ steps.semver.outputs.version }} | ${{ steps.semver.outputs.tag }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────── feature/* , PRs y develop: calidad ─────────────────
  unit-tests:
    name: Unit tests (dummy)
    needs: setup
    if: needs.setup.outputs.kind != 'release'   # en main no se re-testea: se promociona
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Ejecutando unit tests dummy..."
          sleep 2
          echo "42 passed, 0 failed"

  sonarqube:
    name: SonarQube (dummy)
    needs: [setup, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Analisis SonarQube dummy..."
          sleep 2
          echo "Quality Gate: PASSED"

  # ───────────────── develop / release / hotfix: build + tag ─────────────────
  build:
    name: Build (dummy)
    needs: [setup, unit-tests, sonarqube]
    if: github.event_name != 'pull_request' && (needs.setup.outputs.kind == 'prerelease' || needs.setup.outputs.kind == 'rc')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build imagen dummy ${{ needs.setup.outputs.tag }}
        run: |
          echo "docker build -t lab-mode:${{ needs.setup.outputs.tag }} ."
          mkdir -p dist
          echo "image=lab-mode:${{ needs.setup.outputs.tag }} sha=${GITHUB_SHA}" > dist/image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ needs.setup.outputs.tag }}
          path: dist/
          retention-days: 7

  tag:
    name: Tag ${{ needs.setup.outputs.tag }}
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Crear y publicar tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.setup.outputs.tag }}" -m "${{ needs.setup.outputs.tag }}" "$GITHUB_SHA"
          git push origin "${{ needs.setup.outputs.tag }}"
          echo "Tag publicado: ${{ needs.setup.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"

  # ───────────────── develop -> DEV ─────────────────
  deploy-dev:
    name: Deploy DEV (dummy)
    needs: [setup, tag]
    if: needs.setup.outputs.kind == 'prerelease'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - run: |
          echo "helm upgrade lab-mode --set image.tag=${{ needs.setup.outputs.tag }} -n dev"
          echo "Desplegado ${{ needs.setup.outputs.tag }} en DEV"

  # ───────────────── release/* y hotfix/* -> PRE ─────────────────
  publish-artifacts:
    name: Publish artifacts (dummy)
    needs: [setup, tag]
    if: needs.setup.outputs.kind == 'rc'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "docker push registry/lab-mode:${{ needs.setup.outputs.tag }}"
          echo "Imagen publicada en el registry"

  deploy-pre:
    name: Deploy PRE (dummy)
    needs: [setup, publish-artifacts]
    if: needs.setup.outputs.kind == 'rc'
    runs-on: ubuntu-latest
    environment: pre
    steps:
      - run: |
          echo "helm upgrade lab-mode --set image.tag=${{ needs.setup.outputs.tag }} -n pre"
          echo "Desplegado ${{ needs.setup.outputs.tag }} en PRE"

  # ───────────────── main -> PRO (retag, sin rebuild) ─────────────────
  retag:
    name: Retag imagen (dummy)
    needs: setup
    if: needs.setup.outputs.kind == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retag ${{ needs.setup.outputs.rc_tag }} -> ${{ needs.setup.outputs.tag }}
        run: |
          echo "docker buildx imagetools create -t registry/lab-mode:${{ needs.setup.outputs.tag }} registry/lab-mode:${{ needs.setup.outputs.rc_tag }}"
          echo "Misma imagen, sin rebuild"
      - name: Tag estable + GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ needs.setup.outputs.tag }}" >/dev/null 2>&1 || \
          gh release create "${{ needs.setup.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "${{ needs.setup.outputs.tag }}" \
            --generate-notes

  deploy-pro:
    name: Deploy PRO (dummy, gated)
    needs: [setup, retag]
    runs-on: ubuntu-latest
    # Configurar "Required reviewers" en Settings > Environments > pro  (Gated approval)
    environment: pro
    steps:
      - name: Deploy
        run: |
          echo "helm upgrade lab-mode --set image.tag=${{ needs.setup.outputs.tag }} -n pro"
          echo "Desplegado ${{ needs.setup.outputs.tag }} en PRO"
      - name: Simular fallo (workflow_dispatch fail_pro_deploy)
        if: github.event.inputs.fail_pro_deploy == 'true'
        run: |
          echo "::error::Fallo simulado en Deploy PRO"
          exit 1

  # ───────────────── Sync main -> develop (solo tras Deploy OK en PRO) ─────────────────
  sync-develop:
    name: Merge main -> develop
    needs: [setup, deploy-pro]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge main en develop
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout develop
          if git merge --no-ff origin/main -m "chore: sync main ($TAG) into develop"; then
            if git push origin develop; then
              echo "mode=direct" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push directo rechazado (rama protegida?), abriendo PR"
          else
            git merge --abort || true
            echo "Conflicto en el merge, abriendo PR"
          fi
          git checkout -B "sync/main-$TAG" origin/main
          git push -f origin "sync/main-$TAG"
          gh pr create --base develop --head "sync/main-$TAG" \
            --title "chore: sync main ($TAG) into develop" \
            --body "Back-merge automatico tras Deploy OK en PRO de $TAG." || true
          echo "mode=pr" >> "$GITHUB_OUTPUT"
      - name: Re-disparar develop (los pushes con GITHUB_TOKEN no disparan workflows)
        if: steps.merge.outputs.mode == 'direct'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run gitflow.cicd.yaml --ref develop
