name: GitFlow CI/CD (dummy)

# Pipeline dummy del flujo docs/gitflow-v2.png. Todo lo de Docker/ACR/AKS/Helm/Sonar es `echo`;
# lo real es el versionado, el tageo, el PR automatico y la sincronizacion de ramas.
#   feature/*, PR  -> unit tests + sonar
#   develop        -> tests + sonar + build/push imagen X.Y.Z-prerelease.N + tag + deploy DEV
#   release/X.Y.Z  -> build/push imagen X.Y.Z-rc.N + tag + deploy PRE + PR automatico a main
#   hotfix/X.Y.Z   -> idem release (sin cambios propios = noop)
#   main           -> retag imagen X.Y.Z (sin rebuild) + deploy PRE + deploy PRO (gated) + tag/Release + sync a develop
# Version: .github/scripts/semver.sh (Conventional Commits + version.json como suelo).
#
# Secret opcional GITFLOW_TOKEN (PAT o GitHub App): si existe, los pushes/PRs que hace el pipeline
# disparan workflows con normalidad. Si no, se usa GITHUB_TOKEN y se re-dispara via workflow_dispatch.

on:
  push:
    branches: [develop, main, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [develop, main, 'release/**']
  workflow_dispatch:
    inputs:
      fail_pro_deploy:
        description: 'Simular fallo en Deploy PRO (no debe haber tag/Release ni sync)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write

# Una ejecucion a la vez por rama; nunca cancelar (evita tags duplicados y deploys a medias)
concurrency:
  group: gitflow-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

env:
  ACR: acrlab.azurecr.io   # dummy
  APP: gui-lab

jobs:
  # ───────────── Versionado automatico ─────────────
  setup:
    name: Calcular version
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.semver.outputs.kind }}
      version: ${{ steps.semver.outputs.version }}
      tag: ${{ steps.semver.outputs.tag }}
      image_tag: ${{ steps.semver.outputs.image_tag }}
      rc_tag: ${{ steps.semver.outputs.rc_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --tags --force
      - id: semver
        env:
          BRANCH: ${{ github.event_name == 'pull_request' && 'pr-check' || github.ref_name }}
        run: .github/scripts/semver.sh "$BRANCH" version.json
      - name: Resumen
        run: |
          {
            echo "### Version"
            echo "| kind | version | tag | imagen |"
            echo "|---|---|---|---|"
            echo "| ${{ steps.semver.outputs.kind }} | ${{ steps.semver.outputs.version }} | ${{ steps.semver.outputs.tag }} | ${{ steps.semver.outputs.image_tag }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────── Calidad: feature/*, PRs y develop ─────────────
  unit-tests:
    name: Unit tests (dummy)
    needs: setup
    if: needs.setup.outputs.kind == 'feature' || needs.setup.outputs.kind == 'prerelease'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Ejecutando unit tests dummy..."
          sleep 2
          echo "42 passed, 0 failed"

  sonarqube:
    name: SonarQube (dummy)
    needs: [setup, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Analisis SonarQube dummy..."
          sleep 2
          echo "Quality Gate: PASSED"

  # ───────────── develop / release / hotfix: imagen + tag ─────────────
  build:
    name: Build + push imagen (dummy)
    needs: [setup, unit-tests, sonarqube]
    # rc: sin tests/sonar (ya pasaron en develop). prerelease: exige sonar OK.
    if: |
      !cancelled() && github.event_name != 'pull_request' && needs.setup.result == 'success' &&
      (needs.setup.outputs.kind == 'rc' ||
       (needs.setup.outputs.kind == 'prerelease' && needs.sonarqube.result == 'success'))
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.img.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: img
        run: |
          IMG="$ACR/$APP:${{ needs.setup.outputs.image_tag }}"
          echo "docker build -t $IMG ."
          echo "docker push $IMG"
          DIGEST="sha256:$(echo -n "$IMG$GITHUB_SHA" | sha256sum | cut -d' ' -f1)"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Imagen $IMG ($DIGEST)" >> "$GITHUB_STEP_SUMMARY"

  tag:
    name: Tag ${{ needs.setup.outputs.tag }}
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITFLOW_TOKEN || github.token }}
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.setup.outputs.tag }}" -m "${{ needs.setup.outputs.tag }}" "$GITHUB_SHA"
          git push origin "${{ needs.setup.outputs.tag }}"

  deploy-dev:
    name: Deploy DEV (dummy)
    needs: [setup, tag]
    if: needs.setup.outputs.kind == 'prerelease'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - run: |
          echo "helm upgrade --install $APP chart/ -n dev --atomic --wait --set image.tag=${{ needs.setup.outputs.image_tag }}"
          echo "Desplegado ${{ needs.setup.outputs.image_tag }} en DEV"

  deploy-pre:
    name: Deploy PRE rc (dummy)
    needs: [setup, tag]
    if: needs.setup.outputs.kind == 'rc'
    runs-on: ubuntu-latest
    environment: pre
    steps:
      - run: |
          echo "helm upgrade --install $APP chart/ -n pre --atomic --wait --set image.tag=${{ needs.setup.outputs.image_tag }}"
          echo "Desplegado ${{ needs.setup.outputs.image_tag }} en PRE"

  # PR automatico a main solo cuando PRE esta OK
  open-pr:
    name: Abrir PR a main
    needs: [setup, deploy-pre]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITFLOW_TOKEN || github.token }}
          BR: ${{ github.ref_name }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          EXISTING=$(gh pr list --head "$BR" --base main --state open --json number -q '.[0].number')
          if [[ -n "$EXISTING" ]]; then echo "PR #$EXISTING ya existe"; exit 0; fi
          gh pr create --base main --head "$BR" \
            --title "chore(release): v$VERSION" \
            --body "Deploy PRE OK con ${{ needs.setup.outputs.tag }}. Mergear con **merge commit** (no squash) para promocionar a PRO."

  # ───────────── main -> PRE (X.Y.Z) -> PRO (retag, sin rebuild) ─────────────
  retag:
    name: Retag imagen (dummy)
    needs: setup
    if: needs.setup.outputs.kind == 'release'
    runs-on: ubuntu-latest
    steps:
      - run: |
          RC="${{ needs.setup.outputs.rc_tag }}"; RC="${RC#v}"
          echo "az acr import --name acrlab --source $ACR/$APP:$RC --image $APP:${{ needs.setup.outputs.image_tag }} --force"
          echo "Misma imagen (mismo digest), sin rebuild"

  deploy-pre-final:
    name: Deploy PRE X.Y.Z (dummy)
    needs: [setup, retag]
    runs-on: ubuntu-latest
    environment: pre
    steps:
      - run: |
          echo "helm upgrade --install $APP chart/ -n pre --atomic --wait --set image.tag=${{ needs.setup.outputs.image_tag }}"

  deploy-pro:
    name: Deploy PRO (dummy, gated)
    needs: [setup, deploy-pre-final]
    runs-on: ubuntu-latest
    # Settings > Environments > pro > Required reviewers  (Gated approval)
    environment: pro
    steps:
      - run: |
          echo "helm upgrade --install $APP chart/ -n pro --atomic --wait --set image.tag=${{ needs.setup.outputs.image_tag }}"
          echo "Desplegado ${{ needs.setup.outputs.image_tag }} en PRO"
      - name: Simular fallo
        if: github.event.inputs.fail_pro_deploy == 'true'
        run: |
          echo "::error::Fallo simulado en Deploy PRO"
          exit 1

  # Tag estable + Release: SOLO si el deploy a PRO fue OK
  release:
    name: Tag + Release ${{ needs.setup.outputs.tag }}
    needs: [setup, deploy-pro]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITFLOW_TOKEN || github.token }}
        run: |
          gh release view "${{ needs.setup.outputs.tag }}" >/dev/null 2>&1 || \
          gh release create "${{ needs.setup.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "${{ needs.setup.outputs.tag }}" \
            --generate-notes

  # main -> develop solo tras Deploy PRO OK
  sync-develop:
    name: Merge main -> develop
    needs: [setup, release]
    runs-on: ubuntu-latest
    env:
      HAS_PAT: ${{ secrets.GITFLOW_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITFLOW_TOKEN || github.token }}
      - id: merge
        env:
          GH_TOKEN: ${{ secrets.GITFLOW_TOKEN || github.token }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout develop
          if git merge --no-ff origin/main -m "chore: sync main ($TAG) into develop"; then
            if git push origin develop; then
              echo "mode=direct" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "Push directo rechazado (rama protegida?), abriendo PR"
          else
            git merge --abort || true
            echo "Conflicto en el merge, abriendo PR"
          fi
          git checkout -B "sync/main-$TAG" origin/main
          git push -f origin "sync/main-$TAG"
          gh pr create --base develop --head "sync/main-$TAG" \
            --title "chore: sync main ($TAG) into develop" \
            --body "Back-merge automatico tras Deploy OK en PRO de $TAG." || true
          echo "mode=pr" >> "$GITHUB_OUTPUT"
      - name: Re-disparar develop (sin PAT los pushes no disparan workflows)
        if: steps.merge.outputs.mode == 'direct' && env.HAS_PAT != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run gitflow.cicd.yaml --ref develop
