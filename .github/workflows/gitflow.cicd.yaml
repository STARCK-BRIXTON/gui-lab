name: GitFlow CI/CD (dummy)

# Pipeline dummy de docs/gitflow-v4.png. Docker/ACR/AKS/Helm/Sonar/Anchore son `echo`;
# lo real es el versionado, la promocion y la sincronizacion de ramas.
#
# TAGS: en git solo existe vX.Y.Z (lo crea `finalize` tras PRO OK). prerelease.N y rc.N son tags de IMAGEN en el ACR.
# "Validado en PRE" = deployment OK en el environment `pre` (scripts/validated.sh), no un tag.
#
#   feature/*, PR a develop -> unit tests + sonar
#   develop                 -> tests + sonar + build/push X.Y.Z-prerelease.N + scan
#                              -> deploy DEV -> clone a PRE (X.Y.Z-rc.N, mismo digest) -> deploy PRE
#                              (PRE se congela mientras haya release/* o hotfix/* abierto)
#   release/X.Y.Z           -> "Release" corta en el ultimo commit validado en PRE: NO construye, solo promociona.
#                              Con un fix nuevo: tests + sonar + build + scan + rc.N -> PRE -> promociona.
#   hotfix/X.Y.Z            -> tests + sonar + build + scan + rc.N -> PRE -> promociona
#   promocion               -> clone pre->pro (sha-<sha7> -> X.Y.Z) -> aprobacion gated -> deploy PRO desde la rama
#                              -> SOLO si PRO OK: merge a main + tag vX.Y.Z + Release + sync develop
# Version y kind: .github/scripts/semver.sh. N del build = github.run_number.
#
# Secret opcional GITFLOW_TOKEN (GitHub App/PAT): con el, los pushes del pipeline disparan workflows y
# pueden saltar proteccion de ramas. Sin el se usa GITHUB_TOKEN y se re-dispara via workflow_dispatch.

on:
  push:
    branches: [develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      fail_pro_deploy:
        description: 'Simular fallo en Deploy PRO (main no debe tocarse)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  deployments: read

# Una ejecucion a la vez por rama; nunca cancelar (evita deploys a medias)
concurrency:
  group: gitflow-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

env:
  ACR: acrlab.azurecr.io   # dummy
  APP: gui-lab

jobs:
  # ───────────── Version + estado ─────────────
  setup:
    name: Calcular version
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.semver.outputs.kind }}
      version: ${{ steps.semver.outputs.version }}
      image_tag: ${{ steps.semver.outputs.image_tag }}
      rc_image: ${{ steps.semver.outputs.rc_image }}
      sha_tag: ${{ steps.semver.outputs.sha_tag }}
      pre_frozen: ${{ steps.freeze.outputs.frozen }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --tags --force
      - name: Validado en PRE? (deployment OK de este commit; solo release/hotfix)
        id: validated
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == release/* || "$GITHUB_REF_NAME" == hotfix/* ]] && [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "pre_validated=$(.github/scripts/validated.sh "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          else
            echo "pre_validated=false" >> "$GITHUB_OUTPUT"
          fi
      - id: semver
        env:
          BRANCH: ${{ github.event_name == 'pull_request' && 'pr-check' || github.ref_name }}
          BUILD_N: ${{ github.run_number }}
          PRE_VALIDATED: ${{ steps.validated.outputs.pre_validated }}
        run: .github/scripts/semver.sh "$BRANCH" version.json
      - name: PRE congelado si hay release/hotfix abierto
        id: freeze
        run: |
          OPEN=$(git ls-remote --heads origin 'release/*' 'hotfix/*' | wc -l | tr -d ' ')
          if [[ "$OPEN" -gt 0 ]]; then echo "frozen=true" >> "$GITHUB_OUTPUT"; else echo "frozen=false" >> "$GITHUB_OUTPUT"; fi
      - name: Resumen
        run: |
          {
            echo "### Version"
            echo "| kind | version | imagen build | imagen PRE | sha | validado en PRE | PRE congelado |"
            echo "|---|---|---|---|---|---|---|"
            echo "| ${{ steps.semver.outputs.kind }} | ${{ steps.semver.outputs.version }} | ${{ steps.semver.outputs.image_tag }} | ${{ steps.semver.outputs.rc_image }} | ${{ steps.semver.outputs.sha_tag }} | ${{ steps.validated.outputs.pre_validated }} | ${{ steps.freeze.outputs.frozen }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────── Calidad: feature/*, PRs, develop y fixes de release/hotfix ─────────────
  unit-tests:
    name: Unit tests (dummy)
    needs: setup
    if: contains(fromJSON('["feature","prerelease","rc"]'), needs.setup.outputs.kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Ejecutando unit tests dummy..."
          sleep 2
          echo "42 passed, 0 failed"

  sonarqube:
    name: SonarQube (dummy)
    needs: [setup, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Analisis SonarQube dummy..."
          sleep 2
          echo "Quality Gate: PASSED"

  # ───────────── Build + scan (develop, y fixes de release/hotfix) ─────────────
  build:
    name: Build + push imagen (dummy)
    needs: [setup, sonarqube]
    if: github.event_name != 'pull_request' && contains(fromJSON('["prerelease","rc"]'), needs.setup.outputs.kind)
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.img.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: img
        run: |
          IMG="$ACR/$APP:${{ needs.setup.outputs.image_tag }}"
          SHA_IMG="$ACR/$APP:${{ needs.setup.outputs.sha_tag }}"
          echo "docker build -t $IMG -t $SHA_IMG ."
          echo "docker push $IMG; docker push $SHA_IMG   # sha-<sha7>: tag inmutable que se promueve"
          DIGEST="sha256:$(echo -n "$IMG$GITHUB_SHA" | sha256sum | cut -d' ' -f1)"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Imagen $IMG ($DIGEST)" >> "$GITHUB_STEP_SUMMARY"

  scan:
    name: Scan imagen (anchore, dummy)
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "anchore/scan-action: image=$ACR/$APP:${{ needs.setup.outputs.image_tag }} fail-build=true severity-cutoff=high"
          echo "Sin vulnerabilidades high/critical"
      # Real:
      # - uses: anchore/scan-action@v6
      #   with:
      #     image: ${{ env.ACR }}/${{ env.APP }}:${{ needs.setup.outputs.image_tag }}
      #     fail-build: true
      #     severity-cutoff: high

  # ───────────── DEV -> PRE ─────────────
  deploy-dev:
    name: Deploy DEV (dummy)
    needs: [setup, scan]
    if: needs.setup.outputs.kind == 'prerelease'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - run: |
          echo "helm upgrade --install $APP chart/ -n dev --atomic --wait --set image.tag=${{ needs.setup.outputs.image_tag }}"
          echo "Desplegado ${{ needs.setup.outputs.image_tag }} en DEV"

  clone-pre:
    name: Clone imagen dev -> pre (dummy)
    needs: [setup, build, deploy-dev]
    if: needs.setup.outputs.pre_frozen != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "az acr import --name acrlab-pre --source $ACR/$APP:${{ needs.setup.outputs.image_tag }} --image $APP:${{ needs.setup.outputs.rc_image }} --image $APP:${{ needs.setup.outputs.sha_tag }}"
          echo "Digest ${{ needs.build.outputs.digest }} (mismo digest, sin rebuild)"

  deploy-pre:
    name: Deploy PRE (dummy)
    needs: [setup, scan, clone-pre]
    # develop: tras clone (si PRE no esta congelado). rc (fix de release/hotfix): directo tras el scan.
    if: |
      !cancelled() && needs.scan.result == 'success' &&
      ((needs.setup.outputs.kind == 'prerelease' && needs.clone-pre.result == 'success') ||
       needs.setup.outputs.kind == 'rc')
    runs-on: ubuntu-latest
    environment: pre
    concurrency:
      group: deploy-pre
      cancel-in-progress: false
    steps:
      - run: |
          echo "helm upgrade --install $APP chart/ -n pre --atomic --wait --set image.tag=${{ needs.setup.outputs.rc_image }}"
          echo "Desplegado ${{ needs.setup.outputs.rc_image }} en PRE (deployment OK = commit validado en PRE)"

  # ───────────── Promocion a PRO desde release/* o hotfix/* ─────────────
  retag:
    name: Clone imagen pre -> pro (dummy)
    needs: [setup, deploy-pre]
    # promote: HEAD ya desplegado OK en PRE (no se construye). rc: tras construir y validar el fix en PRE.
    if: |
      !cancelled() && needs.setup.result == 'success' &&
      (needs.setup.outputs.kind == 'promote' ||
       (needs.setup.outputs.kind == 'rc' && needs.deploy-pre.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - run: |
          SRC="${{ needs.setup.outputs.sha_tag }}"
          echo "az acr import --name acrlab-pro --source $ACR/$APP:$SRC --image $APP:${{ needs.setup.outputs.version }}"
          echo "$SRC -> ${{ needs.setup.outputs.version }}: mismo digest, sin rebuild"

  deploy-pro:
    name: Deploy PRO (dummy, gated)
    needs: [setup, retag]
    runs-on: ubuntu-latest
    # Settings > Environments > pro > Required reviewers (Gated approval) y Deployment branches: release/**, hotfix/**
    environment: pro
    concurrency:
      group: deploy-pro
      cancel-in-progress: false
    steps:
      - run: |
          echo "helm upgrade --install $APP chart/ -n pro --atomic --wait --set image.tag=${{ needs.setup.outputs.version }}"
          echo "Desplegado ${{ needs.setup.outputs.version }} en PRO desde ${{ github.ref_name }}"
      - name: Simular fallo
        if: github.event.inputs.fail_pro_deploy == 'true'
        run: |
          echo "::error::Fallo simulado en Deploy PRO"
          exit 1

  # Solo tras PRO OK. Unico tag git: vX.Y.Z. Idempotente: se puede relanzar con "Re-run failed jobs".
  finalize:
    name: Merge a main + tag + Release
    needs: [setup, deploy-pro]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITFLOW_TOKEN || github.token }}
      - name: Merge, tag y Release
        env:
          GH_TOKEN: ${{ secrets.GITFLOW_TOKEN || github.token }}
          BR: ${{ github.ref_name }}
          TAG: v${{ needs.setup.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BR" --tags
          if ! git merge-base --is-ancestor "origin/$BR" HEAD; then
            git merge --no-ff "origin/$BR" -m "chore(release): $TAG" || { git merge --abort; echo "::error::Conflicto al mergear $BR en main"; exit 1; }
            git push origin main || { echo "::error::Push a main rechazado: permitir bypass al bot/token (GITFLOW_TOKEN) en el ruleset de main"; exit 1; }
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git tag -a "$TAG" -m "$TAG" HEAD
            git push origin "$TAG"
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$(git rev-parse HEAD)" --title "$TAG" --generate-notes
          git push origin --delete "$BR" || true

  sync-develop:
    name: Merge main -> develop
    needs: [setup, finalize]
    runs-on: ubuntu-latest
    env:
      HAS_PAT: ${{ secrets.GITFLOW_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITFLOW_TOKEN || github.token }}
      - id: merge
        env:
          GH_TOKEN: ${{ secrets.GITFLOW_TOKEN || github.token }}
          TAG: v${{ needs.setup.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then echo "mode=none" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git merge --no-ff origin/main -m "chore: sync main ($TAG) into develop"; then
            if git push origin develop; then echo "mode=direct" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "Push directo rechazado (rama protegida?), abriendo PR"
          else
            git merge --abort || true
            echo "Conflicto en el merge, abriendo PR"
          fi
          git checkout -B "sync/main-$TAG" origin/main
          git push -f origin "sync/main-$TAG"
          gh pr create --base develop --head "sync/main-$TAG" \
            --title "chore: sync main ($TAG) into develop" \
            --body "Back-merge automatico tras Deploy OK en PRO de $TAG." || true
          echo "mode=pr" >> "$GITHUB_OUTPUT"
      - name: Re-disparar develop (sin PAT los pushes no disparan workflows)
        if: steps.merge.outputs.mode == 'direct' && env.HAS_PAT != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run gitflow.cicd.yaml --ref develop

  # Un hotfix tambien debe llegar a una release abierta (se revalida: la rama pasa a tener un commit nuevo sin rc)
  sync-release:
    name: Merge main -> release abierta
    needs: [setup, finalize]
    if: startsWith(github.ref_name, 'hotfix/')
    runs-on: ubuntu-latest
    env:
      HAS_PAT: ${{ secrets.GITFLOW_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITFLOW_TOKEN || github.token }}
      - env:
          GH_TOKEN: ${{ secrets.GITFLOW_TOKEN || github.token }}
          TAG: v${{ needs.setup.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          for REF in $(git ls-remote --heads origin 'release/*' | awk '{print $2}' | sed 's#refs/heads/##'); do
            git checkout -B "$REF" "origin/$REF"
            if git merge-base --is-ancestor origin/main HEAD; then continue; fi
            if git merge --no-ff origin/main -m "chore: sync main ($TAG) into $REF"; then
              git push origin "$REF"
              [[ "$HAS_PAT" == "true" ]] || gh workflow run gitflow.cicd.yaml --ref "$REF"
            else
              git merge --abort || true
              echo "::warning::Conflicto al sincronizar main en $REF: resolver a mano"
            fi
          done
